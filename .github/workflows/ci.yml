name: ROS 2 Docker Build and Push

on:
  push:
    branches:
      - project_ros_gaz  # Runs the workflow when code is pushed to this branch

jobs:
  build-and-push:
    runs-on: ubuntu-24.04  # Specifies the use of Ubuntu 24.04 for the runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: tangbr/project1_ros2:latest  # Modify accordingly

  test-container:
    needs: build-and-push
    runs-on: ubuntu-latest  # Ensure Docker is available by default

    steps:
      - name: Pull and Run the Docker Container
        run: |
          docker pull tangbr/project1_ros2:latest
          timeout 10s docker run --rm --name test_ros_container tangbr/project1_ros2 /bin/bash -c "
          echo 'Setting up ROS environment...'
          source /opt/ros/jazzy/setup.bash && \
          source /root/dev_ws/install/setup.bash && \
          
          echo 'Verifying package structure...'
          ls -al /root/dev_ws/src/my_robot_controller && \
          
          echo 'Checking if my_robot_controller package is installed...'
          ros2 pkg list | grep my_robot_controller || echo 'ERROR: my_robot_controller package not found' && \

          echo 'Making move_robot.py executable...'
          chmod +x /root/dev_ws/src/my_robot_controller/my_robot_controller/move_robot.py && \

          echo 'Checking installed executables in bin/...'
          ls -al /root/dev_ws/install/my_robot_controller/bin/ && \

          echo 'Checking installed package in site-packages/...'
          ls -al /root/dev_ws/install/my_robot_controller/lib/python*/site-packages/ && \

          echo 'Verifying AMENT_PREFIX_PATH...'
          echo \$AMENT_PREFIX_PATH && \

          echo 'Manually adding package to PATH...'
          export PATH=\$PATH:/root/dev_ws/install/my_robot_controller/bin && \

          echo 'Rechecking PATH variable...'
          echo \$PATH && \

          echo 'Checking installed ROS 2 executables...'
          ls -al /root/dev_ws/install/my_robot_controller/lib/my_robot_controller/ || echo 'WARNING: No executables found in expected location' && \

          echo 'Trying to run move_robot manually...'
          /root/dev_ws/install/my_robot_controller/bin/move_robot || echo 'ERROR: move_robot failed manually' && \

          echo 'Running move_robot node (with timeout)...'
          timeout 5s ros2 run my_robot_controller move_robot || echo 'ERROR: move_robot failed to execute'"