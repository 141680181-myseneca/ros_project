name: ROS 2 Docker Build and Push

on:
  push:
    branches:
      - project_ros_gaz

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: tangbr/project1_ros2:latest
          no-cache: true
          
  test-container:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Pull and Run the Docker Container
        run: |
          docker pull tangbr/project1_ros2:latest
          docker run --rm --name test_ros_container tangbr/project1_ros2 /bin/bash -c '
            echo "Setting up ROS environment..."
            source /opt/ros/humble/setup.bash && \
            source /root/dev_ws/install/setup.bash
            
            echo "Verifying package structure..."
            ls -R /root/dev_ws/src/my_robot_controller || { echo "❌ ERROR: Package directory missing!"; exit 1; }
            
            echo "Checking if my_robot_controller package is installed..."
            ros2 pkg list | grep my_robot_controller || { echo "❌ ERROR: Package not found in ROS 2!"; exit 1; }
            
            echo "Checking package contents before build..."
            ls -R /root/dev_ws/src/my_robot_controller/my_robot_controller || { echo "❌ ERROR: Python package not found!"; exit 1; }
            
            echo "Trying to run move_robot manually..."
            /root/dev_ws/install/bin/move_robot || { echo "⚠️ WARNING: move_robot failed manually"; }

            echo "Preparing to run move_robot via ros2 run..."
            export AMENT_PREFIX_PATH=/root/dev_ws/install
            
            echo "Running move_robot node (with timeout)..."
            source /opt/ros/humble/setup.bash && \
            source /root/dev_ws/install/setup.bash && \
            timeout 5s ros2 run my_robot_controller move_robot || { echo "⚠️ WARNING: move_robot failed to execute"; }

            echo "Running ros2 doctor to diagnose the ROS 2 setup..."
            ros2 doctor || { echo "⚠️ WARNING: ros2 doctor found issues"; }
          '
