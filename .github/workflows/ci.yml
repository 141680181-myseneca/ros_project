name: ROS 2 Docker Build and Push

on:
  push:
    branches:
      - project_ros_gaz  # Ensure this is the branch you want to target

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # This only specifies the host runner, not the build environment

    # Defines the Docker environment to be used for building and pushing
    container:
      image: ubuntu:24.04  # Explicitly using Ubuntu 24.04

    steps:
      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y docker.io
          dockerd &
          sleep 5  # Give Docker some time to start
          
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: tangbr/project1_ros2:latest  # Customize this tag as necessary

  test-container:
    needs: build-and-push
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Pull and Run the Docker Container
        run: |
          docker pull tangbr/project1_ros2:latest
          docker run --rm tangbr/project1_ros2
