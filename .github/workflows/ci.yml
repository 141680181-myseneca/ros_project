name: ROS 2 Docker Build and Push

on:
  push:
    branches:
      - project_ros_gaz  # Runs the workflow when code is pushed to this branch

jobs:
  build-and-push:
    runs-on: ubuntu-24.04  # Use Ubuntu 24.04 for the runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: tangbr/project1_ros2:latest  # Modify the tag as needed
          no-cache: true
          
  test-container:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Pull and Run the Docker Container
        run: |
          docker pull tangbr/project1_ros2:latest
          timeout 10s docker run --rm --name test_ros_container tangbr/project1_ros2 /bin/bash -c '
          
          echo "Setting up ROS environment..."
          source /opt/ros/humble/setup.bash && \
          source /root/dev_ws/install/setup.bash
          
          echo "Verifying package structure..."
          ls -R /root/dev_ws/src/my_robot_controller || { echo "❌ ERROR: Package directory missing!"; exit 1; }
          
          echo "Checking if my_robot_controller package is installed..."
          ros2 pkg list | grep my_robot_controller || { echo "❌ ERROR: Package not found in ROS 2!"; exit 1; }
          
          echo "Checking package contents before build..."
          ls -R /root/dev_ws/src/my_robot_controller/my_robot_controller || { echo "❌ ERROR: Python package not found!"; exit 1; }
          
          echo "🔨 Fixing Python Path before build..."
          export PYTHONPATH=$PYTHONPATH:/root/dev_ws/src/my_robot_controller
          
          echo "Verifying colcon build output..."
          if [ ! -f /root/dev_ws/install/share/ament_index/resource_index/packages/my_robot_controller ]; then
            echo "❌ ERROR: colcon build failed, package not installed!";
            exit 1;
          fi

          
          echo "Checking installed executables in merged install (bin/) directory..."
          ls -al /root/dev_ws/install/bin/ || { echo "❌ ERROR: No executables found!"; exit 1; }
          
          echo "Verifying AMENT_PREFIX_PATH..."
          echo $AMENT_PREFIX_PATH
          
          echo "Manually adding package to PATH..."
          export PATH=$PATH:/root/dev_ws/install/bin
          
          echo "Rechecking PATH variable..."
          echo $PATH
          
          echo "Trying to run move_robot manually..."
          /root/dev_ws/install/bin/move_robot || { echo "❌ ERROR: move_robot failed manually"; exit 1; }
          
          echo "Preparing to run move_robot via ros2 run..."
          export AMENT_PREFIX_PATH=/root/dev_ws/install
          
          echo "Running move_robot node (with timeout)..."
          source /opt/ros/humble/setup.bash && \
          source /root/dev_ws/install/setup.bash && \
          timeout 5s ros2 run my_robot_controller move_robot || { echo "❌ ERROR: move_robot failed to execute"; exit 1; }
          '