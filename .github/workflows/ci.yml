name: ROS 2 Docker Build and Push

on:
  push:
    branches:
      - project_ros_gaz  # Runs workflow when code is pushed to this branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Uses the latest available Ubuntu runner

    container:
      image: ubuntu:24.04  # Explicitly runs the job in an Ubuntu 24.04 environment

    steps:
      - name: Install Dependencies for CI
        run: |
          apt-get update
          apt-get install -y curl git gnupg2 lsb-release

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: tangbr/project1_ros2:latest  # Replace with your actual Docker Hub username/project

  test-container:
    needs: build-and-push
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04  # Explicitly runs the test in Ubuntu 24.04

    steps:
      - name: Pull and Run the Docker Container
        run: |
          docker pull tangbr/project1_ros2:latest
          docker run --rm tangbr/project1_ros2
